<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/tagg/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Tagg — a real-time, location-based multiplayer tag game. Open a lobby, draw your role, tag in the real world."
    />
    <title>Tagg — real-world tag</title>

    <!-- Body/UI: Inter · Terminal: JetBrains Mono · Display: Press Start 2P -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />

    <!--
      Set the theme attribute before first paint so the page never flashes the
      wrong background. The two hex values here mirror the bg tokens in
      src/theme/theme.ts — the only place colors are repeated, because CSS+JS
      haven't loaded yet.
    -->
    <script>
      ;(function () {
        var stored = null
        try {
          stored = localStorage.getItem('tagg-site-theme')
        } catch (error) {}
        var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches
        var mode = stored === 'dark' || stored === 'light' ? stored : prefersLight ? 'light' : 'dark'
        document.documentElement.dataset.theme = mode
      })()
    </script>
    <style>html{background-color:#000}html[data-theme=light]{background-color:#fff}</style>
    <script type="module" crossorigin src="/tagg/assets/index-DtFVSoRr.js"></script>
    <link rel="stylesheet" crossorigin href="/tagg/assets/index-C6qz3izy.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
