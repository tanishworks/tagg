<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/tagg/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Tagg — a real-time, location-based multiplayer tag game. Open a lobby, draw your role, tag in the real world."
    />
    <title>Tagg — real-world tag</title>

    <!--
      Self-hosted fonts (public/fonts + fonts.css, OFL via @fontsource).
      Preload the files above the fold uses so downloads start at head-parse,
      ahead of the stylesheet → CSS parse → text paint chain.
    -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="fonts/inter-latin-400-normal.woff2"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="fonts/inter-latin-600-normal.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="fonts/jetbrains-mono-latin-400-normal.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="fonts/press-start-2p-latin-400-normal.woff2"
    />
    <link rel="stylesheet" href="fonts.css" />

    <!--
      Set the theme attribute before first paint so the page never flashes the
      wrong background. The two hex values here mirror the bg tokens in
      src/theme/theme.ts — the only place colors are repeated, because CSS+JS
      haven't loaded yet.
    -->
    <script>
      ;(function () {
        var stored = null
        try {
          stored = localStorage.getItem('tagg-site-theme')
        } catch (error) {}
        var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches
        var mode = stored === 'dark' || stored === 'light' ? stored : prefersLight ? 'light' : 'dark'
        document.documentElement.dataset.theme = mode
      })()
    </script>
    <style>html{background-color:#000}html[data-theme=light]{background-color:#fff}</style>
    <script type="module" crossorigin src="/tagg/assets/index-BvQRvRYL.js"></script>
    <link rel="stylesheet" crossorigin href="/tagg/assets/index-zaRjsRhO.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
